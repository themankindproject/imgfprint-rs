[package]
name = "imgfprint"
version = "0.4.5"
edition = "2021"
description = "High-performance, deterministic image fingerprinting library"
license = "MIT"
keywords = ["image", "fingerprint", "perceptual-hash", "semantic", "deduplication"]
categories = ["multimedia::images", "algorithms"]
documentation = "https://docs.rs/imgfprint"
rust-version = "1.88"
repository = "https://github.com/themankindproject/imgfprint-rs"
readme = "README.md"
exclude      = [
    ".github/**",
    ".claude/**",
    "benches/**",
    "examples/**",
    "tests/**",
    "fuzz/**",
    "future.md",
    "image.md",
    "logo-preview.html",
    "CONTRIBUTING.md",
    "CLAUDE.md",
    ".mcp.json",
    "*.sh",
]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
fast_image_resize = { version = "6.0", features = ["image"] }
blake3 = "1.8"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"], optional = true }
rayon = { version = "1.10", optional = true }
tract-onnx = { version = "0.22.1", optional = true }
tracing = { version = "0.1", optional = true }
subtle = "2.6"
bytemuck = { version = "1.18", features = ["derive"] }

[features]
default = ["serde", "parallel"]
serde = ["dep:serde"]
parallel = ["dep:rayon"]
local-embedding = ["dep:tract-onnx"]
tracing = ["dep:tracing"]
# Reserved for future watermarking support. The feature existed with four
# dependencies (rand_chacha, rand_core, hmac, sha2) but zero implementation;
# the dead dependencies were removed. The feature name is kept so existing
# `--features watermark` builds keep compiling.
watermark = []

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0"
bincode = "1.3.3"  # v2 has breaking API changes; pin until upgrade
proptest = "1.5"

[[example]]
name = "semantic_search"
required-features = ["local-embedding"]

[[example]]
name = "serialize"
required-features = ["serde"]

[[example]]
name = "zero_copy_persistence"

[[bench]]
name = "benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2
