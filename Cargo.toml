[package]
name = "imgfprint"
version = "0.4.7"
edition = "2021"
description = "High-performance, deterministic image fingerprinting library"
license = "MIT"
keywords = ["image", "fingerprint", "perceptual-hash", "semantic", "deduplication"]
categories = ["multimedia::images", "algorithms"]
documentation = "https://docs.rs/imgfprint"
rust-version = "1.88"
repository = "https://github.com/themankindproject/imgfprint-rs"
readme = "README.md"
exclude = [
    ".github/**",
    ".claude/**",
    ".codex/**",
    "AGENTS.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    ".mcp.json",
    "benches/**",
    "examples/**",
    "tests/**",
    "fuzz/**",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
fast_image_resize = { version = "6.0", features = ["image"] }
blake3 = "1.8"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"], optional = true }
rayon = { version = "1.10", optional = true }
tract-onnx = { version = "0.22.1", optional = true }
tracing = { version = "0.1", optional = true }
bytemuck = { version = "1.18", features = ["derive"] }

[features]
default = ["serde", "parallel"]
serde = ["dep:serde"]
parallel = ["dep:rayon"]
local-embedding = ["dep:tract-onnx"]
tracing = ["dep:tracing"]
# Extra input formats (PNG, JPEG, GIF, WebP, and BMP are always on).
# All pure Rust; each only enables the matching `image` decoder.
#
# TGA is deliberately absent: it has no magic bytes, so a byte-sniffing API
# (every entry point here) can never detect it. Enabling `image/tga` would
# compile but never match, which is worse than not offering it.
tiff = ["image/tiff"]
ico = ["image/ico"]
pnm = ["image/pnm"]
qoi = ["image/qoi"]
# Deprecated no-op, kept only so existing `--features watermark` builds keep
# compiling; it will be removed in 0.5.
watermark = []

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0"
bincode = "1.3.3"  # v2 has breaking API changes; pin until upgrade
proptest = "1.5"

[[example]]
name = "semantic_search"
required-features = ["local-embedding"]

[[example]]
name = "serialize"
required-features = ["serde"]

[[example]]
name = "zero_copy_persistence"

[[bench]]
name = "benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2
# Slimmer debug artifacts: line tables keep usable backtraces while
# cutting debuginfo bloat in target/debug (see RUST_BUILD_CACHE policy).
debug = "line-tables-only"
